name: CI

# 为什么 CI 只跑「语料无关」的检查？
# ---------------------------------------------------------------------------
# 本项目的测试多用 `tmp_data_dir` / `imported_db` 夹具，会对 `data/` 做一次完整导入，
# 因此依赖 `data/raw/` 下的原始语料（学生手册 PDF 等）。而这些文件版权归校方、**未随
# 仓库分发**，且 importer 对 manifest 缺失文件是显式报错、KG 中出现引用不到的文档还会
# 抛「悬空关系」——所以无法在 CI 里跑完整用例。
# 完整 67 项请在本地放好原始语料与 BGE 模型后执行：python -m pytest -q
# 本工作流负责守住「不依赖语料」的那部分：前端语法、数据文件完整性、后端能否装配、
# 以及 6 个语料无关用例（含评测集规模与降级链）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 前端脚本语法检查
        run: |
          n=0
          for f in frontend/js/*.js; do
            node --check "$f"
            n=$((n + 1))
          done
          echo "前端 $n 个脚本语法检查通过"

      - name: 数据文件完整性
        run: |
          python - <<'PY'
          import glob, json
          files = sorted(glob.glob("data/**/*.json", recursive=True))
          for f in files:
              json.load(open(f, encoding="utf-8"))
          print(f"{len(files)} 个 JSON 文件均可解析")
          PY

      - name: 后端冒烟（装配应用 + CLI 可运行）
        run: |
          python -c "from app.config import get_settings; from app.web.server import create_app; create_app(get_settings()); print('create_app 成功')"
          python -m app.cli stats > stats.txt || true
          grep -q "结果：" stats.txt && echo "CLI 可运行"

      - name: 运行测试（语料无关用例）
        env:
          USE_LOCAL_EMBEDDING: "off"
          USE_LOCAL_RERANKER: "off"
        run: |
          python -m pytest -q \
            tests/test_qa.py::test_storage_unavailable_raises \
            tests/test_phase2.py::test_hashing_embedder_deterministic \
            tests/test_phase3.py::test_local_model_paths_configured \
            tests/test_phase3.py::test_embedder_prefers_local \
            tests/test_phase3.py::test_reranker_orders_relevant_first \
            tests/test_phase3.py::test_evaluation_dataset_size
