name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 前端脚本语法检查
        run: |
          for f in frontend/js/*.js; do
            node --check "$f"
          done

      # 原始 PDF（学生手册等）版权归校方、未随仓库分发；importer 对缺失文件会显式报错，
      # 故先剔除这些 manifest 条目，用仓库内已分发的样例数据运行测试。
      - name: 准备 CI 数据
        run: python scripts/prepare_ci_data.py

      - name: 运行测试
        env:
          USE_LOCAL_EMBEDDING: "off"
          USE_LOCAL_RERANKER: "off"
        # test_ml_local_available_detection 断言本地 BGE 模型文件存在；
        # 模型体积 GB 级、不入库，CI 环境不下载，故排除该环境相关用例。
        # 完整 67 项请在本地放好原始文件与模型后执行 python -m pytest -q。
        run: python -m pytest -q -k "not ml_local_available_detection"
