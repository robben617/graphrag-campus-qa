name: CI

# CI 使用公开演示语料验证导入与问答。完整回归在本地补齐学生手册等文件后运行。
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 前端脚本语法检查
        run: |
          n=0
          for f in frontend/js/*.js; do
            node --check "$f"
            n=$((n + 1))
          done
          echo "前端 $n 个脚本语法检查通过"

      - name: 数据文件完整性
        run: |
          python - <<'PY'
          import glob, json
          files = sorted(glob.glob("data/**/*.json", recursive=True) + glob.glob("demo/**/*.json", recursive=True))
          for f in files:
              json.load(open(f, encoding="utf-8"))
          print(f"{len(files)} 个 JSON 文件均可解析")
          PY

      - name: 运行公开演示冒烟与回归测试
        env:
          USE_LOCAL_EMBEDDING: "off"
          USE_LOCAL_RERANKER: "off"
        run: |
          python -m pytest -q \
            tests/test_demo.py \
            tests/test_versioning.py \
            tests/test_retrieval.py::test_hybrid_filters_inactive_documents_before_ranking \
            tests/test_retrieval.py::test_faq_requires_exact_question_and_active_source \
            tests/test_retrieval.py::test_entity_name_alone_does_not_match_unrelated_clause \
            tests/test_qa.py::test_storage_unavailable_raises \
            tests/test_phase2.py::test_hashing_embedder_deterministic \
            tests/test_phase3.py::test_local_model_paths_configured \
            tests/test_phase3.py::test_embedder_prefers_local \
            tests/test_phase3.py::test_reranker_orders_relevant_first \
            tests/test_phase3.py::test_evaluation_dataset_size
