# 校园知识问答系统 —— Docker Compose（应用 + 反向代理）
# 第三阶段：容器化部署（§6 挑战版#18）。
#
# 使用：
#   docker compose up -d --build
#   后端  http://localhost:8000  （API + /docs）
#   前端  http://localhost:8080  （nginx 托管 frontend/，反向代理 /api → 后端）
#
# 本地模型（BGE）体积较大，通过命名卷挂载；若无本地模型，后端会自动降级为哈希向量器。

services:
  backend:
    build: .
    container_name: school-agent-backend
    environment:
      - SCHOOL_DB_PATH=/app/data/school_kb.db
      - SCHOOL_DATA_DIR=/app/data
      - USE_LOCAL_EMBEDDING=${USE_LOCAL_EMBEDDING:-auto}
      - USE_LOCAL_RERANKER=${USE_LOCAL_RERANKER:-auto}
      - LOCAL_MODELS_DIR=/app/local_models/models
      - CORS_ORIGINS=*
    env_file:
      - .env
    volumes:
      - school-data:/app/data
      - local-models:/app/local_models
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: school-agent-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  school-data:
  local-models:
