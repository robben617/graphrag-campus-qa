x-knowledge-service: &knowledge-service
  image: ${SCHOOL_DOCKER_IMAGE:-graphrag-campus-qa:local}
  pull_policy: never
  env_file:
    - path: ${SCHOOL_CONTAINER_ENV_FILE:-.env.container}
      required: false
  environment:
    SCHOOL_DB_PATH: /app/runtime/${SCHOOL_CONTAINER_DB_NAME:-demo.db}
    SCHOOL_DATA_DIR: /app/corpus
    USE_LOCAL_EMBEDDING: ${USE_LOCAL_EMBEDDING:-auto}
    USE_LOCAL_RERANKER: ${USE_LOCAL_RERANKER:-auto}
    LOCAL_MODELS_DIR: /app/local_models/models
    ALLOW_SERVER_LLM_FALLBACK: ${ALLOW_SERVER_LLM_FALLBACK:-false}
  volumes:
    - school-data:/app/runtime
    - local-models:/app/local_models
    - ${SCHOOL_CORPUS_DIR:-./demo}:/app/corpus:ro

services:
  knowledge-init:
    <<: *knowledge-service
    command: ["python", "-m", "app.cli", "import", "--profile", "${SCHOOL_IMPORT_PROFILE:-demo}"]

  backend:
    <<: *knowledge-service
    build: .
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:${SCHOOL_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SCHOOL_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  school-data:
  local-models:
